services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy
      POSTGRES_DB: electricity
    build:
      context: ./db
      dockerfile: Dockerfile
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d electricity"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
  adminer:
    image: adminer
    restart: always
    ports:
      - 8088:8080
